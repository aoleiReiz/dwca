<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>城市探索打卡之旅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0D1117;--fg:#E6EDF3;--muted:#7D8590;--accent:#F5A623;--accent-glow:rgba(245,166,35,.25);--success:#10B981;--success-glow:rgba(16,185,129,.25);--border:rgba(255,255,255,.07);--card:rgba(255,255,255,.04)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
        #bgC{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .atmo{position:fixed;top:-40%;left:50%;transform:translateX(-50%);width:140%;height:60%;background:radial-gradient(ellipse,rgba(245,166,35,.06)0%,transparent 70%);z-index:0;pointer-events:none}
        .app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:0 20px 60px;min-height:100vh}
        .hdr{padding:28px 0 20px;text-align:center}
        .hdr h1{font-size:26px;font-weight:900;background:linear-gradient(135deg,#F5A623,#F97316,#EF4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
        .hdr p{color:var(--muted);font-size:13px;margin-top:6px;font-weight:300;letter-spacing:1px}

        /* 用户输入 */
        .uid-bar{display:flex;gap:8px;margin-bottom:20px}
        .uid-bar input{flex:1;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--fg);font-size:14px;font-family:inherit;outline:none;transition:border-color .3s}
        .uid-bar input:focus{border-color:rgba(245,166,35,.3)}
        .uid-bar input::placeholder{color:rgba(125,133,144,.5)}
        .uid-bar input:disabled{opacity:.5}
        .btn-sm{padding:12px 18px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .3s;white-space:nowrap}
        .btn-ac{background:linear-gradient(135deg,var(--accent),#F97316);color:#0D1117}
        .btn-ac:hover{box-shadow:0 4px 16px var(--accent-glow)}

        /* 进度 */
        .prog{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 22px;margin-bottom:24px;position:relative;overflow:hidden}
        .prog::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(245,166,35,.3),transparent)}
        .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .prog-top span{font-size:13px;color:var(--muted)}
        .prog-top strong{color:var(--accent);font-size:20px;font-weight:900}
        .prog-bar{width:100%;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
        .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
        .done-b{margin-top:14px;padding:12px 16px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.15);border-radius:12px;display:none;align-items:center;justify-content:space-between}
        .done-b.show{display:flex}
        .done-b .dl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--success);font-weight:500}

        /* 站点 */
        .spath{position:relative;padding-bottom:8px}
        .ptrack{position:absolute;left:27px;top:28px;bottom:28px;width:2px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.06)0px,rgba(255,255,255,.06)6px,transparent 6px,transparent 12px)}
        .pfill{position:absolute;left:27px;top:28px;width:2px;background:var(--success);border-radius:1px;transition:height .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--success-glow)}
        .si{position:relative;display:flex;align-items:flex-start;gap:16px;padding:10px 0;cursor:pointer;transition:opacity .3s}
        .si.locked{cursor:not-allowed;opacity:.35}
        .si.completed{cursor:default}
        .sd{flex-shrink:0;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;z-index:2;transition:all .4s;border:2.5px solid rgba(255,255,255,.06);background:var(--bg);color:var(--muted)}
        .si.active .sd{border-color:var(--accent);background:rgba(245,166,35,.08);color:var(--accent);box-shadow:0 0 24px var(--accent-glow);animation:dp 2.2s ease-in-out infinite}
        .si.completed .sd{border-color:var(--success);background:var(--success);color:#fff;box-shadow:0 0 12px var(--success-glow)}
        @keyframes dp{0%,100%{box-shadow:0 0 24px var(--accent-glow)}50%{box-shadow:0 0 36px var(--accent-glow),0 0 60px rgba(245,166,35,.1)}}
        .sc{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:all .3s}
        .si.active .sc{border-color:rgba(245,166,35,.18);background:rgba(245,166,35,.04)}
        .si.completed .sc{border-color:rgba(16,185,129,.12);background:rgba(16,185,129,.03)}
        .sn{font-size:15px;font-weight:700;margin-bottom:3px}
        .si.active .sn{color:var(--accent)}
        .si.completed .sn{color:var(--success)}
        .sdesc{font-size:12px;color:var(--muted);line-height:1.5}
        .sa{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;transition:all .3s}
        .si.active .sa{background:rgba(245,166,35,.12);color:var(--accent)}
        .si.completed .sa{background:rgba(16,185,129,.1);color:var(--success)}
        .si.locked .sa{background:rgba(255,255,255,.03);color:var(--muted)}
        .st{font-size:11px;color:rgba(125,133,144,.6);margin-top:5px}

        /* 模态框 */
        .mo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s;backdrop-filter:blur(6px)}
        .mo.show{opacity:1;visibility:visible}
        .mb{width:88%;max-width:360px;background:#161B26;border:1px solid var(--border);border-radius:24px;overflow:hidden;transform:scale(.92) translateY(16px);transition:all .4s cubic-bezier(.34,1.56,.64,1)}
        .mo.show .mb{transform:scale(1) translateY(0)}

        /* 二维码模态框 */
        .qr-modal-body{padding:32px 24px 28px;text-align:center}
        .qr-title{font-size:18px;font-weight:900;margin-bottom:4px}
        .qr-desc{font-size:13px;color:var(--muted);margin-bottom:20px}
        .qr-img-wrap{display:flex;justify-content:center;margin-bottom:20px;position:relative}
        .qr-img-wrap img{width:220px;height:220px;border-radius:16px;background:#fff;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
        .qr-hint{font-size:13px;color:var(--accent);font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
        .qr-hint i{animation:blink 1.5s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
        .qr-sub{font-size:11px;color:var(--muted);margin-bottom:20px}
        .qr-loading{width:220px;height:220px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.03);margin:0 auto 20px}
        .qr-loading i{font-size:32px;color:var(--accent);animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s;font-family:inherit}
        .btn:active{transform:scale(.98)}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#F97316);color:#0D1117}
        .btn-primary:hover{box-shadow:0 6px 24px var(--accent-glow)}
        .btn-ghost{background:rgba(255,255,255,.05);color:var(--muted);margin-top:8px}

        /* 礼物模态 */
        .gift-hdr{position:relative;padding:44px 24px 28px;text-align:center;background:linear-gradient(180deg,rgba(245,166,35,.07)0%,transparent 100%)}
        .gift-iw{width:110px;height:110px;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center}
        .gift-iw i{font-size:60px;color:var(--accent);animation:gb 2.5s ease-in-out infinite}
        @keyframes gb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(3deg)}}
        .spk{position:absolute;border-radius:50%;animation:spp 2s ease-in-out infinite}
        @keyframes spp{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
        .gift-body{padding:0 24px 36px;text-align:center}
        .gift-title{font-size:24px;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#F5A623,#EF4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .gift-desc{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.7}
        .gift-prize{display:inline-flex;align-items:center;gap:8px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.18);padding:10px 22px;border-radius:14px;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:24px}
        .btn-claim{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#F5A623,#F97316,#EF4444);color:#fff;font-family:inherit;letter-spacing:2px;position:relative;overflow:hidden;transition:all .3s}
        .btn-claim::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transition:left .5s}
        .btn-claim:hover::after{left:100%}
        .btn-claim:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(245,166,35,.35)}
        .claimed-s{padding:0 24px 36px;text-align:center;display:none}
        .claimed-b{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.18);padding:12px 28px;border-radius:14px;color:var(--success);font-weight:700;font-size:16px}

        /* 规则 */
        .rules{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
        .rules-t{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .rules-t i{color:var(--accent);font-size:13px}
        .rules ul{list-style:none}
        .rules li{font-size:12px;color:var(--muted);line-height:2;padding-left:14px;position:relative}
        .rules li::before{content:'';position:absolute;left:0;top:11px;width:4px;height:4px;border-radius:50%;background:rgba(245,166,35,.5)}
        .rst{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:10px 20px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .3s;font-family:inherit;width:100%}
        .rst:hover{border-color:rgba(239,68,68,.25);color:#EF4444;background:rgba(239,68,68,.04)}
        .footer{text-align:center;padding:28px 0 12px;font-size:11px;color:rgba(125,133,144,.35)}

        /* Toast */
        .tbar{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1C2333;border:1px solid var(--border);padding:12px 22px;border-radius:14px;font-size:13px;z-index:500;transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;max-width:90%}
        .tbar.show{transform:translateX(-50%) translateY(0)}

        .poll-badge{position:fixed;bottom:16px;right:16px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.15);padding:6px 12px;border-radius:10px;font-size:11px;color:var(--success);z-index:10;display:none;align-items:center;gap:6px}
        .poll-badge.show{display:flex}
        .poll-badge i{animation:spin 2s linear infinite}
    </style>
</head>
<body>
<canvas id="bgC"></canvas>
<div class="atmo"></div>

<div class="app">
    <header class="hdr">
        <h1>城市探索之旅</h1>
        <p>扫码打卡五站，赢取专属探索者礼物</p>
    </header>

    <!-- 用户ID -->
    <div class="uid-bar">
        <input type="tel" id="uidIn" placeholder="输入你的手机号" maxlength="11">
        <button class="btn-sm btn-ac" id="btnJoin">加入</button>
    </div>

    <!-- 进度 -->
    <section class="prog" id="progCard" style="display:none">
        <div class="prog-top">
            <span>探索进度</span>
            <strong id="progTxt">0 / 5</strong>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        <div class="done-b" id="doneB">
            <div class="dl"><i class="fa-solid fa-circle-check"></i><span>全部打卡完成</span></div>
            <button class="btn-sm btn-ac" id="btnGift" style="padding:8px 18px;font-size:13px">领取礼物</button>
        </div>
    </section>

    <!-- 站点 -->
    <section class="spath" id="spath" style="display:none">
        <div class="ptrack"></div>
        <div class="pfill" id="pfill" style="height:0"></div>
    </section>

    <section class="rules">
        <div class="rules-t"><i class="fa-solid fa-circle-info"></i> 活动规则</div>
        <ul>
            <li>输入手机号加入活动</li>
            <li>点击站点弹出二维码，用手机微信扫一扫完成签到</li>
            <li>按站点顺序依次打卡，不可跳站</li>
            <li>集齐五站打卡即可领取专属探索者礼物</li>
        </ul>
    </section>

    <button class="rst" id="rstBtn"><i class="fa-solid fa-rotate-left"></i> 重置打卡进度</button>
    <footer class="footer">城市探索之旅 · 主办方保留最终解释权</footer>
</div>

<!-- ===== 二维码模态框 ===== -->
<div class="mo" id="qrModal">
    <div class="mb">
        <div class="qr-modal-body">
            <div class="qr-title" id="qrTitle">站点名称</div>
            <div class="qr-desc" id="qrDesc">站点描述</div>
            <div id="qrContent">
                <div class="qr-loading"><i class="fa-solid fa-spinner"></i></div>
            </div>
            <div class="qr-hint"><i class="fa-solid fa-qrcode"></i> 请用手机微信扫一扫此二维码</div>
            <div class="qr-sub">扫码后将跳转到签到确认页</div>
            <button class="btn btn-ghost" id="btnQrClose">关闭</button>
        </div>
    </div>
</div>

<!-- ===== 礼物模态框 ===== -->
<div class="mo" id="giftModal">
    <div class="mb">
        <div class="gift-hdr">
            <div class="gift-iw" id="giftIw"><i class="fa-solid fa-gift"></i></div>
        </div>
        <div class="gift-body" id="giftBody">
            <div class="gift-title">恭喜完成全部探索</div>
            <div class="gift-desc">你已成功打卡全部五站<br>快来领取你的专属探索者礼物</div>
            <div class="gift-prize"><i class="fa-solid fa-trophy"></i> 限量版探索者徽章套装</div>
            <button class="btn-claim" id="btnClaim">立即领取礼物</button>
        </div>
        <div class="claimed-s" id="claimedS">
            <div class="claimed-b"><i class="fa-solid fa-circle-check"></i> 礼物已领取</div>
            <div style="font-size:12px;color:var(--muted);margin-top:14px">请向工作人员出示此页面</div>
            <button class="btn btn-ghost" id="btnCloseG" style="margin-top:18px">关闭</button>
        </div>
    </div>
</div>

<!-- 轮询提示 -->
<div class="poll-badge" id="pollBadge"><i class="fa-solid fa-rotate"></i> 自动刷新进度中</div>

<!-- Toast -->
<div class="tbar" id="toast"><i id="tIcon"></i><span id="tTxt"></span></div>

<script>
/* ===== 站点元数据 ===== */
const SM = {
    1:{name:'启程广场',icon:'fa-solid fa-flag',color:'#F5A623'},
    2:{name:'星光市集',icon:'fa-solid fa-utensils',color:'#F97316'},
    3:{name:'云端画廊',icon:'fa-solid fa-palette',color:'#EC4899'},
    4:{name:'潮流工坊',icon:'fa-solid fa-hammer',color:'#14B8A6'},
    5:{name:'秘密花园',icon:'fa-solid fa-gift',color:'#10B981'},
};

let uid = localStorage.getItem('explore_uid') || '';
let pollTimer = null;

/* ===== 用户加入 ===== */
const uidIn = document.getElementById('uidIn');
const btnJoin = document.getElementById('btnJoin');

if (uid) { uidIn.value = uid; enterApp(); }

btnJoin.addEventListener('click', () => {
    const v = uidIn.value.trim();
    if (!v) { toast('请输入手机号','warn'); return; }
    if (!/^1\d{10}$/.test(v) && v.length < 3) { toast('请输入有效手机号','warn'); return; }
    uid = v;
    localStorage.setItem('explore_uid', uid);
    enterApp();
});
uidIn.addEventListener('keydown', e => { if(e.key==='Enter') btnJoin.click(); });

async function enterApp() {
    await loadAndRender();
    document.getElementById('progCard').style.display = '';
    document.getElementById('spath').style.display = '';
    uidIn.disabled = true;
    btnJoin.textContent = '已加入'; btnJoin.disabled = true; btnJoin.style.opacity = '.5';
    startPoll();
}

/* ===== 轮询进度（手机扫码签到后自动刷新） ===== */
function startPoll() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadAndRender, 3000); // 每3秒刷新
    document.getElementById('pollBadge').classList.add('show');
}

/* ===== 加载 & 渲染 ===== */
async function loadAndRender() {
    try {
        const res = await fetch(`/api/stations?uid=${encodeURIComponent(uid)}`);
        const data = await res.json();
        renderStations(data);
    } catch(e) {}
}

function renderStations(data) {
    const wrap = document.getElementById('spath');
    wrap.querySelectorAll('.si').forEach(el => el.remove());

    const done = data.progress.done;
    const total = data.progress.total;

    document.getElementById('progTxt').textContent = `${done} / ${total}`;
    document.getElementById('progFill').style.width = `${data.progress.percent}%`;

    const banner = document.getElementById('doneB');
    if (data.progress.all_done) {
        banner.classList.add('show');
        document.getElementById('btnGift').textContent = data.gift_claimed ? '查看礼物' : '领取礼物';
    } else {
        banner.classList.remove('show');
    }

    let curId = null;
    for (const s of data.stations) { if (!s.checked_in) { curId = s.id; break; } }

    data.stations.forEach(s => {
        const completed = s.checked_in;
        const active = s.id === curId;
        const locked = !completed && !active;
        const meta = SM[s.id] || {};

        const el = document.createElement('div');
        el.className = 'si' + (completed?' completed':'') + (active?' active':'') + (locked?' locked':'');

        const icon = completed ? 'fa-solid fa-check' : (meta.icon || 'fa-solid fa-circle');
        const color = meta.color || '#F5A623';

        let ds = '';
        if (completed) ds = `border-color:${color};background:${color};`;
        else if (active) ds = `border-color:${color};color:${color};background:${color}12;box-shadow:0 0 24px ${color}30;`;

        let actH;
        if (completed) actH = `<div class="sa" style="background:rgba(16,185,129,.1);color:var(--success)"><i class="fa-solid fa-circle-check"></i> 已签到</div>`;
        else if (active) actH = `<div class="sa" style="background:rgba(245,166,35,.12);color:var(--accent)"><i class="fa-solid fa-qrcode"></i> 点击出示二维码</div>`;
        else actH = `<div class="sa" style="background:rgba(255,255,255,.03);color:var(--muted)"><i class="fa-solid fa-lock"></i> 未解锁</div>`;

        const ts = s.checkin_time ? new Date(s.checkin_time).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

        el.innerHTML = `
            <div class="sd" style="${ds}"><i class="${icon}"></i></div>
            <div class="sc">
                <div class="sn" style="${active?'color:'+color:''}">${s.name}</div>
                <div class="sdesc">${s.desc}</div>
                ${actH}
                ${ts?`<div class="st"><i class="fa-regular fa-clock"></i> ${ts}</div>`:''}
            </div>`;

        if (active) el.addEventListener('click', () => openQR(s));
        else if (locked) el.addEventListener('click', () => toast('请先完成前方站点的打卡','warn'));

        wrap.appendChild(el);
    });

    // 路径填充
    requestAnimationFrame(() => {
        const items = wrap.querySelectorAll('.si');
        if (!items.length || done === 0) { document.getElementById('pfill').style.height='0px'; return; }
        const track = wrap.querySelector('.ptrack');
        const wR = wrap.getBoundingClientRect();
        const tR = track.getBoundingClientRect();
        const tTop = tR.top - wR.top;
        let lastIdx = -1;
        data.stations.forEach((s,i) => { if(s.checked_in) lastIdx=i; });
        if (lastIdx < 0) { document.getElementById('pfill').style.height='0px'; return; }
        const dotEl = items[lastIdx].querySelector('.sd');
        const dR = dotEl.getBoundingClientRect();
        document.getElementById('pfill').style.height = Math.max(0, dR.top+dR.height/2-wR.top-tTop)+'px';
    });
}

/* ===== 弹出二维码 ===== */
async function openQR(station) {
    document.getElementById('qrTitle').textContent = station.name;
    document.getElementById('qrDesc').textContent = station.desc;
    document.getElementById('qrContent').innerHTML = '<div class="qr-loading"><i class="fa-solid fa-spinner"></i></div>';
    showM('qrModal');

    try {
        const res = await fetch(`/api/qrcode/${station.id}`);
        const data = await res.json();

        if (data.ok) {
            document.getElementById('qrContent').innerHTML =
                `<div class="qr-img-wrap"><img src="${data.image_url}" alt="签到二维码"></div>`;
        } else {
            document.getElementById('qrContent').innerHTML =
                `<div style="color:var(--muted);padding:20px">二维码生成失败，请重试</div>`;
        }
    } catch(e) {
        document.getElementById('qrContent').innerHTML =
            `<div style="color:var(--muted);padding:20px">网络错误</div>`;
    }
}

document.getElementById('btnQrClose').addEventListener('click', () => hideM('qrModal'));

/* ===== 礼物 ===== */
document.getElementById('btnGift').addEventListener('click', () => { openGift(); confetti(); });

function openGift() {
    const w = document.getElementById('giftIw');
    w.querySelectorAll('.spk').forEach(e=>e.remove());
    const cs = ['#F5A623','#F97316','#10B981','#EF4444','#EC4899','#14B8A6'];
    for(let i=0;i<10;i++){
        const s=document.createElement('div'); s.className='spk';
        const sz=4+Math.random()*5;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${5+Math.random()*90}%;top:${5+Math.random()*90}%;animation-delay:${Math.random()*2}s;background:${cs[i%cs.length]}`;
        w.appendChild(s);
    }
    loadAndRender().then(d=>{});
    // 检查是否已领取
    fetch(`/api/stations?uid=${encodeURIComponent(uid)}`).then(r=>r.json()).then(d=>{
        if(d.gift_claimed){
            document.getElementById('giftBody').style.display='none';
            document.getElementById('claimedS').style.display='block';
        } else {
            document.getElementById('giftBody').style.display='block';
            document.getElementById('claimedS').style.display='none';
        }
    });
    showM('giftModal');
}

document.getElementById('btnClaim').addEventListener('click', async()=>{
    const res = await fetch('/api/claim_gift',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})});
    const d = await res.json();
    if(d.ok){
        document.getElementById('giftBody').style.display='none';
        document.getElementById('claimedS').style.display='block';
        confetti(); toast('礼物领取成功！','ok');
    } else { toast(d.msg||'领取失败','warn'); }
});
document.getElementById('btnCloseG').addEventListener('click',()=>hideM('giftModal'));

/* ===== 重置 ===== */
document.getElementById('rstBtn').addEventListener('click',()=>{
    const ov=document.createElement('div');ov.className='mo show';ov.style.zIndex='400';
    ov.innerHTML=`<div class="mb" style="padding:32px 24px;text-align:center">
        <div style="font-size:38px;color:#EF4444;margin-bottom:14px"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div style="font-size:17px;font-weight:800;margin-bottom:6px">确认重置进度</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6">所有打卡记录将被清除，此操作不可撤销</div>
        <div style="display:flex;gap:12px;margin-top:22px">
            <button class="btn btn-ghost" style="margin-top:0" id="_no">取消</button>
            <button class="btn btn-primary" style="background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;margin-top:0" id="_yes">确认重置</button>
        </div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#_no').onclick=()=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),300)};
    ov.querySelector('#_yes').onclick=async()=>{await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})});await loadAndRender();ov.classList.remove('show');setTimeout(()=>ov.remove(),300);toast('进度已重置','info')};
    ov.addEventListener('click',e=>{if(e.target===ov){ov.classList.remove('show');setTimeout(()=>ov.remove(),300)}});
});

/* ===== 模态框 ===== */
function showM(id){document.getElementById(id).classList.add('show')}
function hideM(id){document.getElementById(id).classList.remove('show')}
['qrModal','giftModal'].forEach(id=>{document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})});

/* ===== Toast ===== */
let tT=null;
function toast(t,type){
    const el=document.getElementById('toast'),ic=document.getElementById('tIcon');
    document.getElementById('tTxt').textContent=t;
    if(type==='ok'){ic.className='fa-solid fa-circle-check';ic.style.color='#10B981'}
    else if(type==='warn'){ic.className='fa-solid fa-triangle-exclamation';ic.style.color='#F5A623'}
    else{ic.className='fa-solid fa-circle-info';ic.style.color='#3B82F6'}
    el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ===== 庆祝 ===== */
function confetti(){
    const cs=['#F5A623','#F97316','#10B981','#EF4444','#EC4899','#14B8A6'];
    for(let i=0;i<55;i++){setTimeout(()=>{const c=document.createElement('div');c.style.cssText=`position:fixed;z-index:500;pointer-events:none;width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;background:${cs[i%cs.length]};border-radius:${Math.random()>.5?'50%':'2px'};left:${Math.random()*100}vw;top:-12px`;document.body.appendChild(c);const dur=2200+Math.random()*1800,dx=(Math.random()-.5)*220,dy=window.innerHeight+60;c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${300+Math.random()*400}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.25,.46,.45,.94)'}).onfinish=()=>c.remove()},i*25)}
}

/* ===== 背景 ===== */
(function(){
    const cv=document.getElementById('bgC'),cx=cv.getContext('2d');let W,H;const pts=[];
    function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
    for(let i=0;i<30;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.max(.5,Math.random()*1.8),a:.08+Math.random()*.2,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,c:['#F5A623','#F97316','#10B981','#14B8A6'][Math.floor(Math.random()*4)]});
    (function lp(){cx.clearRect(0,0,W,H);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;cx.globalAlpha=p.a;cx.beginPath();cx.arc(p.x,p.y,Math.max(.5,p.r),0,Math.PI*2);cx.fillStyle=p.c;cx.fill()});cx.globalAlpha=1;requestAnimationFrame(lp)})();
})();
</script>
